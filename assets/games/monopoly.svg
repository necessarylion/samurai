<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="A street of townhouses at dusk, with a deed and dice in the foreground">
  <!--
    The painting behind Monopoly's home and lobby column. Like the other six it
    is a wide landscape with its subject right of centre and its lower half in
    shadow, because the column crops it tall and the masthead sits in that
    bottom corner. Drawn in the app's paper/ink tokens rather than imported, so
    it carries no publisher's artwork - an original street, as the board is an
    original set of streets.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9d7b4"/>
      <stop offset="0.45" stop-color="#d9b98d"/>
      <stop offset="1" stop-color="#9d7d5f"/>
    </linearGradient>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c241c" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#2c241c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2c241c" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a5b4a"/>
      <stop offset="1" stop-color="#3a2f26"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f6e3b8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#f6e3b8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- A low sun behind the terrace, right of centre where the subject sits. -->
  <circle cx="1080" cy="430" r="132" fill="#f0cf94" opacity="0.55"/>

  <!-- Far rooftops, flattened into the haze. -->
  <g fill="#b09372" opacity="0.5">
    <path d="M0 470 L90 402 L180 470 Z"/>
    <path d="M150 480 L250 398 L350 480 Z"/>
    <path d="M330 476 L420 414 L510 476 Z"/>
    <rect x="0" y="468" width="520" height="90"/>
  </g>

  <!-- The terrace itself: seven fronts stepping up towards the right. -->
  <g>
    <g fill="#8a6f52">
      <path d="M560 560 L560 400 L640 344 L720 400 L720 560 Z"/>
      <path d="M720 560 L720 380 L800 322 L880 380 L880 560 Z"/>
      <path d="M880 560 L880 358 L968 296 L1056 358 L1056 560 Z"/>
      <path d="M1056 560 L1056 330 L1152 262 L1248 330 L1248 560 Z"/>
      <path d="M1248 560 L1248 366 L1332 306 L1416 366 L1416 560 Z"/>
      <path d="M1416 560 L1416 400 L1496 344 L1576 400 L1576 560 Z"/>
    </g>
    <!-- Lit windows, the only warm marks above the shadow line. -->
    <g fill="#f3d9a4">
      <rect x="596" y="432" width="26" height="34" rx="3"/>
      <rect x="658" y="432" width="26" height="34" rx="3"/>
      <rect x="758" y="412" width="28" height="36" rx="3"/>
      <rect x="820" y="412" width="28" height="36" rx="3" opacity="0.45"/>
      <rect x="916" y="392" width="30" height="40" rx="3"/>
      <rect x="990" y="392" width="30" height="40" rx="3"/>
      <rect x="1098" y="368" width="32" height="44" rx="3" opacity="0.5"/>
      <rect x="1178" y="368" width="32" height="44" rx="3"/>
      <rect x="1288" y="404" width="28" height="38" rx="3"/>
      <rect x="1352" y="404" width="28" height="38" rx="3" opacity="0.4"/>
      <rect x="1452" y="436" width="26" height="34" rx="3"/>
      <rect x="1514" y="436" width="26" height="34" rx="3"/>
    </g>
    <!-- Doors along the pavement. -->
    <g fill="#4b3b2c">
      <rect x="626" y="498" width="30" height="62" rx="4"/>
      <rect x="786" y="490" width="32" height="70" rx="4"/>
      <rect x="952" y="480" width="34" height="80" rx="4"/>
      <rect x="1136" y="470" width="36" height="90" rx="4"/>
      <rect x="1316" y="488" width="32" height="72" rx="4"/>
      <rect x="1482" y="498" width="30" height="62" rx="4"/>
    </g>
  </g>

  <!-- Street lamp, and the pool of light under it. -->
  <ellipse cx="1256" cy="640" rx="190" ry="90" fill="url(#lamp)"/>
  <g fill="#3a2f26">
    <rect x="1250" y="430" width="10" height="190"/>
    <circle cx="1255" cy="424" r="18"/>
  </g>

  <rect x="0" y="556" width="1600" height="344" fill="url(#road)"/>
  <!-- Kerb, then the dashed centre line running out of frame. -->
  <rect x="0" y="556" width="1600" height="10" fill="#9b8b76" opacity="0.55"/>
  <g fill="#b99a5c" opacity="0.35">
    <rect x="60" y="720" width="120" height="10" rx="5"/>
    <rect x="260" y="720" width="120" height="10" rx="5"/>
    <rect x="460" y="720" width="120" height="10" rx="5"/>
    <rect x="660" y="720" width="120" height="10" rx="5"/>
    <rect x="860" y="720" width="120" height="10" rx="5"/>
    <rect x="1060" y="720" width="120" height="10" rx="5"/>
    <rect x="1260" y="720" width="120" height="10" rx="5"/>
    <rect x="1460" y="720" width="120" height="10" rx="5"/>
  </g>

  <!-- Foreground: a deed laid on the road, with two dice on it. -->
  <g transform="rotate(-7 1180 790)">
    <rect x="1040" y="700" width="290" height="180" rx="10" fill="#f2e9db"/>
    <rect x="1040" y="700" width="290" height="44" rx="10" fill="#b23a2c"/>
    <rect x="1040" y="734" width="290" height="10" fill="#b23a2c"/>
    <g fill="#9b8b76">
      <rect x="1068" y="774" width="234" height="9" rx="4"/>
      <rect x="1068" y="800" width="200" height="9" rx="4"/>
      <rect x="1068" y="826" width="168" height="9" rx="4"/>
    </g>
  </g>
  <g>
    <rect x="1128" y="640" width="88" height="88" rx="16" fill="#f6f1e6" transform="rotate(-12 1172 684)"/>
    <g fill="#2c241c" transform="rotate(-12 1172 684)">
      <circle cx="1152" cy="664" r="8"/>
      <circle cx="1192" cy="664" r="8"/>
      <circle cx="1152" cy="704" r="8"/>
      <circle cx="1192" cy="704" r="8"/>
    </g>
    <rect x="1236" y="668" width="76" height="76" rx="14" fill="#f6f1e6" transform="rotate(9 1274 706)"/>
    <g fill="#2c241c" transform="rotate(9 1274 706)">
      <circle cx="1256" cy="688" r="7"/>
      <circle cx="1274" cy="706" r="7"/>
      <circle cx="1292" cy="724" r="7"/>
    </g>
  </g>

  <!-- Two houses and a hotel silhouetted on the near kerb, left of the deed. -->
  <g fill="#2c241c" opacity="0.82">
    <path d="M150 800 L210 752 L270 800 L270 870 L150 870 Z"/>
    <path d="M300 812 L352 770 L404 812 L404 870 L300 870 Z"/>
    <path d="M436 796 L436 748 L470 726 L504 748 L504 796 L560 796 L560 870 L436 870 Z"/>
  </g>

  <rect width="1600" height="900" fill="url(#dusk)"/>
</svg>
